<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Reset Password | Shahebaz Motors
    </title>

    <link
        rel="stylesheet"
        href="admin.css"
    >

</head>


<body>


    <main class="login-wrapper">

        <section class="login-card">


            <div class="brand">

                <div class="brand-logo">
                    SM
                </div>

                <h1>
                    Shahebaz Motors
                </h1>

                <p>
                    Create New Password
                </p>

            </div>



            <!-- LOADING STATE -->

            <div
                id="loadingMsg"
                style="text-align: center; padding: 20px 0;"
            >

                <p style="color: #aeb8bd;">
                    Verifying reset link...
                </p>

            </div>



            <!-- RESET FORM -->

            <form
                id="resetForm"
                style="display: none;"
            >

                <input
                    type="hidden"
                    id="resetToken"
                >


                <div class="form-group">

                    <label for="newPassword">
                        New Password
                    </label>

                    <div class="input-wrapper">

                        <i>🔒</i>

                        <input
                            type="password"
                            id="newPassword"
                            placeholder="Minimum 8 characters"
                            minlength="8"
                            required
                        >

                    </div>

                </div>



                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="input-wrapper">

                        <i>🔒</i>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Re-enter password"
                            minlength="8"
                            required
                        >

                    </div>

                </div>



                <button
                    type="submit"
                    class="login-button"
                    id="submitButton"
                >
                    Reset Password
                </button>



                <div
                    class="error-message"
                    id="errorMsg"
                    style="display: none;"
                >
                </div>


            </form>



            <!-- SUCCESS MESSAGE -->

            <div
                id="successMsg"
                style="display: none; text-align: center; padding: 20px 0;"
            >

                <div
                    style="
                        font-size: 48px;
                        color: #62d89a;
                        margin-bottom: 15px;
                    "
                >
                    ✓
                </div>

                <h2
                    style="
                        color: white;
                        margin-bottom: 12px;
                        font-size: 22px;
                    "
                >
                    Password Reset!
                </h2>

                <p
                    style="
                        color: #aeb8bd;
                        font-size: 14px;
                        line-height: 1.7;
                        margin-bottom: 20px;
                    "
                >
                    Your password has been updated successfully.
                </p>

                <a
                    href="login.html"
                    class="login-button"
                    style="
                        display: inline-block;
                        text-decoration: none;
                        line-height: 52px;
                        width: 100%;
                    "
                >
                    Login Now
                </a>

            </div>



            <!-- ERROR (Token Invalid) -->

            <div
                id="tokenErrorMsg"
                style="display: none; text-align: center; padding: 20px 0;"
            >

                <div
                    style="
                        font-size: 48px;
                        color: #ff6b78;
                        margin-bottom: 15px;
                    "
                >
                    ✗
                </div>

                <h2
                    style="
                        color: white;
                        margin-bottom: 12px;
                        font-size: 22px;
                    "
                >
                    Invalid Link
                </h2>

                <p
                    id="tokenErrorText"
                    style="
                        color: #aeb8bd;
                        font-size: 14px;
                        line-height: 1.7;
                        margin-bottom: 20px;
                    "
                >
                    This reset link is invalid or has expired.
                </p>

                <a
                    href="forgot-password.html"
                    class="login-button"
                    style="
                        display: inline-block;
                        text-decoration: none;
                        line-height: 52px;
                        width: 100%;
                    "
                >
                    Request New Link
                </a>

            </div>



            <a
                href="login.html"
                class="back-link"
            >
                ← Back to Login
            </a>



            <div class="footer-note">
                Authorized access only
            </div>


        </section>

    </main>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get("token");

        const resetForm = document.getElementById("resetForm");
        const loadingMsg = document.getElementById("loadingMsg");
        const successMsg = document.getElementById("successMsg");
        const tokenErrorMsg = document.getElementById("tokenErrorMsg");
        const tokenErrorText = document.getElementById("tokenErrorText");
        const errorMsg = document.getElementById("errorMsg");
        const submitButton = document.getElementById("submitButton");


        // Verify token on page load
        if (!token) {

            loadingMsg.style.display = "none";
            tokenErrorMsg.style.display = "block";
            tokenErrorText.textContent = "No reset token found in the URL.";

        } else {

            document.getElementById("resetToken").value = token;

            fetch("/api/admin/verify-reset-token/" + token)

                .then(res => res.json())

                .then(result => {

                    loadingMsg.style.display = "none";

                    if (result.success) {

                        resetForm.style.display = "block";

                    } else {

                        tokenErrorMsg.style.display = "block";
                        tokenErrorText.textContent =
                            result.message || "Invalid or expired link.";

                    }

                })

                .catch(error => {

                    console.error("Token verification error:", error);

                    loadingMsg.style.display = "none";
                    tokenErrorMsg.style.display = "block";
                    tokenErrorText.textContent =
                        "Unable to verify reset link. Please try again.";

                });

        }


        // Submit new password
        resetForm.addEventListener("submit", async function (e) {

            e.preventDefault();

            const newPassword =
                document.getElementById("newPassword").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;


            errorMsg.style.display = "none";


            if (newPassword.length < 8) {

                errorMsg.textContent =
                    "Password must be at least 8 characters.";

                errorMsg.style.display = "block";

                return;

            }


            if (newPassword !== confirmPassword) {

                errorMsg.textContent = "Passwords do not match.";

                errorMsg.style.display = "block";

                return;

            }


            submitButton.disabled = true;

            submitButton.textContent = "Resetting...";


            try {

                const response = await fetch(
                    "/api/admin/reset-password",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            token: token,
                            new_password: newPassword,
                            confirm_password: confirmPassword
                        })
                    }
                );


                const result = await response.json();


                if (result.success) {

                    resetForm.style.display = "none";

                    successMsg.style.display = "block";

                } else {

                    errorMsg.textContent =
                        result.message || "Failed to reset password.";

                    errorMsg.style.display = "block";

                    submitButton.disabled = false;

                    submitButton.textContent = "Reset Password";

                }

            } catch (error) {

                console.error("Reset error:", error);

                errorMsg.textContent =
                    "Unable to connect to server. Please try again.";

                errorMsg.style.display = "block";

                submitButton.disabled = false;

                submitButton.textContent = "Reset Password";

            }

        });

    </script>


</body>

</html>
