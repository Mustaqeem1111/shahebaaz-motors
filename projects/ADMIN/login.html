<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Admin Login | Shahebaz Motors
    </title>

    <link
        rel="stylesheet"
        href="admin.css"
    >

</head>


<body>


    <main class="login-wrapper">

        <section class="login-card">


            <div class="brand">

                <div class="brand-logo">
                    SM
                </div>

                <h1>
                    Shahebaz Motors
                </h1>

                <p>
                    Administrator Login
                </p>

            </div>



            <form id="adminLoginForm">


                <div class="form-group">

                    <label for="adminUsername">
                        Username
                    </label>


                    <div class="input-wrapper">

                        <i>👤</i>

                        <input
                            type="text"
                            id="adminUsername"
                            name="username"
                            placeholder="Enter admin username"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>



                <div class="form-group">

                    <label for="adminPassword">
                        Password
                    </label>


                    <div class="input-wrapper">

                        <i>🔒</i>

                        <input
                            type="password"
                            id="adminPassword"
                            name="password"
                            placeholder="Enter admin password"
                            autocomplete="current-password"
                            required
                        >

                    </div>

                </div>



                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    Login to Admin Panel
                </button>



                <!-- =====================================================
                     FORGOT PASSWORD LINK
                ====================================================== -->

                <div style="text-align: center; margin-top: 15px;">

                    <a
                        href="forgot-password.html"
                        style="
                            color: #aeb8bd;
                            font-size: 13px;
                            text-decoration: none;
                            transition: color 0.2s ease;
                        "
                        onmouseover="this.style.color='#ffffff'"
                        onmouseout="this.style.color='#aeb8bd'"
                    >
                        Forgot Password?
                    </a>

                </div>



                <div
                    class="error-message"
                    id="loginError"
                    style="display: none;"
                >
                </div>


            </form>



            <a
                href="../index.html"
                class="back-link"
            >
                ← Back to Shahebaz Motors
            </a>



            <div class="footer-note">
                Authorized access only
            </div>


        </section>

    </main>



    <script src="admin.js"></script>

</body>

</html>
